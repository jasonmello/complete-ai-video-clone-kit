<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#0d0d10;font-family:-apple-system,Helvetica,sans-serif}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  h1{color:#fff;font-size:11vw;margin:0;letter-spacing:-.03em}
  .bar{height:1.2vh;background:#ff4d2e;width:0}
  p{color:#bbb;font-size:4.5vw;margin:0}
</style></head>
<body>
<div class="wrap"><h1 id="t">TITLE</h1><div class="bar" id="b"></div><p id="s">subtitle here</p></div>
<script>
  // motion.mjs contract: window.seek(t) draws time t (seconds). No setTimeout, no requestAnimationFrame.
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const t1 = document.getElementById('t'), b = document.getElementById('b'), s = document.getElementById('s');
  window.seek = (t) => {
    const a = ease(t / 0.5), c = ease((t - 0.35) / 0.5), d = ease((t - 0.6) / 0.5);
    t1.style.transform = `translateY(${(1 - a) * 8}vh)`; t1.style.opacity = a;
    b.style.width = `${c * 60}vw`;
    s.style.opacity = d; s.style.transform = `translateY(${(1 - d) * 3}vh)`;
  };
  window.seek(0);
</script>
</body></html>
